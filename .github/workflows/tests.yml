name: pytest-unmagic-django tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
        django: ['4.2', '5.2', '6.0']
        exclude:
          # Django 4.2 is not tested on Python 3.14 (not officially supported)
          - python: '3.14'
            django: '4.2'
          # Django 6.0 requires Python 3.12+ (not officially supported on 3.10)
          - python: '3.10'
            django: '6.0'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - name: Setup
      run: |
        python --version
        pip install --upgrade pip
        pip install "django~=${{ matrix.django }}.0"
        pip install -e .
    - name: Run tests
      run: pytest
